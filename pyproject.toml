[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-blocks"
version = "0.1.0a1"
description = "Scratch/Blockly-style structured visual workflows that compile to LangGraph StateGraph and Functional API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "sxia123" }
]
keywords = ["langgraph", "agents", "visual-programming", "blockly", "workflow", "compiler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
runtime = [
  "langgraph>=0.3.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
langgraph-blocks = "langgraph_blocks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langgraph_blocks = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
